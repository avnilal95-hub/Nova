<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Server | Nova Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">

  <!-- Sticky Glassmorphism Navbar -->
  <nav class="navbar navbar-expanded">
    <a href="index.html" class="nav-brand">
      <div class="logo-box">N</div>
      <span class="brand-name">Nova</span>
    </a>
    
    <div class="nav-user-profile" id="userProfileBar">
      <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="User Avatar" class="user-avatar-sm" id="userAvatar">
      <span class="user-badge" id="userStatus">Connecting...</span>
    </div>
  </nav>

  <!-- Main Section Wrapper -->
  <main class="page-container section-padding">
    
    <!-- Page Header & Live Counters -->
    <div class="servers-header">
      <div>
        <h2 class="page-title-lg">Your Servers</h2>
        <p class="section-subtitle">Select a Discord server to manage Nova settings or invite the bot.</p>
      </div>

      <div class="server-stats-summary">
        <div class="summary-pill">
          <span class="summary-count" id="totalServerCount">0</span>
          <span class="summary-label">Total</span>
        </div>
        <div class="summary-pill active-pill">
          <span class="summary-count green-text" id="activeServerCount">0</span>
          <span class="summary-label">Active</span>
        </div>
      </div>
    </div>

    <!-- Search Bar & Category Filters -->
    <div class="controls-wrapper">
      <div class="search-box glow-search">
        <i data-lucide="search"></i>
        <input type="text" id="serverSearchInput" placeholder="Filter servers by name or Guild ID...">
      </div>

      <div class="filter-pills">
        <button class="pill active" data-filter="all">All Servers</button>
        <button class="pill" data-filter="active">
          <span class="dot green"></span> Active Servers
        </button>
        <button class="pill" data-filter="inactive">
          <span class="dot black"></span> Inactive Servers
        </button>
      </div>
    </div>

    <!-- ACTIVE SERVERS SECTION -->
    <div class="server-section-group" id="activeSectionGroup">
      <div class="section-category-header">
        <h3 class="category-title"><span class="dot green"></span> Active Servers</h3>
        <span class="category-badge" id="activeCategoryCount">0 Servers</span>
      </div>
      <div class="servers-scroll-container" id="activeServersContainer">
        <!-- Active servers render here -->
      </div>
    </div>

    <!-- INACTIVE SERVERS SECTION -->
    <div class="server-section-group" id="inactiveSectionGroup" style="margin-top: 35px;">
      <div class="section-category-header">
        <h3 class="category-title"><span class="dot black"></span> Inactive Servers (Add Nova™)</h3>
        <span class="category-badge grey-badge" id="inactiveCategoryCount">0 Servers</span>
      </div>
      <div class="servers-scroll-container" id="inactiveServersContainer">
        <!-- Inactive servers render here -->
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
